; PlatformIO Project Configuration File
; Board: ESP32-2432S028 (Cheap Yellow Display)
; Project: Emerald — Personal gadget for young programmers
;
; Display: ST7789 320x240 (HSPI: MOSI=13, MISO=12, SCLK=14)
; Touch:   XPT2046 (CS=21)
; RGB LED: R=GPIO26 (shared with speaker), G=GPIO16, B=GPIO17 (common anode, LOW=ON)
;
; TFT_eSPI pins are configured in src/tft_setup.h
; (auto-included by TFT_eSPI.h via __has_include mechanism)

[env:esp32-2432S028]
platform = espressif32
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ============================================================
; Build Flags — include src/ for tft_setup.h auto-detection
; ============================================================
build_flags =
    -I src

; ============================================================
; Library Dependencies
; ============================================================
lib_deps =
    ; TFT_eSPI — display driver (ILI9341, ST7789, etc.)
    bodmer/TFT_eSPI @ ^2.5.43

    ; Touch (XPT2046) is handled directly in TouchManager via TFT_eSPI's SPI bus

; ============================================================
; Upload Settings
; ============================================================
upload_port = /dev/cu.usbserial-110
upload_speed = 115200

